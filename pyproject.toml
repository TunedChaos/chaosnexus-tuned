# chaosnexus-tuned/pyproject.toml
[project]
name = "chaosnexus-tuned"
version = "0.1.0"
description = "ChaosNexus Tuned: dataset generation, evaluation, and fine-tuning pipeline"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.1.57",
    "google-genai>=2.16.0",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "requests>=2.34.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "unsloth>=2025.9.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["scripts"]
